apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aibot-redis
spec:
  serviceName: aibot-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aibot-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aibot-redis
    spec:
      automountServiceAccountToken: false   # Redis 不调用 K8s API，不挂载 SA token
      securityContext:
        runAsNonRoot: true
        runAsUser: 999      # redis:7-alpine 内置 redis 用户
        runAsGroup: 999
        fsGroup: 999        # 数据卷归属 redis 组，保证非 root 可写
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aibot-infra-env
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              if [ -n "${REDIS_PASSWORD}" ]; then
                exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
              fi
              exec redis-server --appendonly yes
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  if [ -n "${REDIS_PASSWORD}" ]; then
                    export REDISCLI_AUTH="${REDIS_PASSWORD}"
                  fi
                  exec redis-cli ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  if [ -n "${REDIS_PASSWORD}" ]; then
                    export REDISCLI_AUTH="${REDIS_PASSWORD}"
                  fi
                  exec redis-cli ping
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
