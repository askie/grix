apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibot-livekit-egress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aibot-livekit-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aibot-livekit-egress
    spec:
      automountServiceAccountToken: false   # Egress 不调用 K8s API，不挂载 SA token
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: egress
          image: livekit/egress:v1.11.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: EGRESS_CONFIG_BODY
              valueFrom:
                secretKeyRef:
                  name: aibot-livekit-egress-env
                  key: EGRESS_CONFIG_BODY
          ports:
            - name: health
              containerPort: 7981
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
