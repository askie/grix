<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grix Widget</title>
  <style>
    :root {
      --theme: #0f766e;
      /* 由 bootstrap 脚本按 theme_color 重新计算的派生色（默认值对应 #0f766e） */
      --theme-soft: #e2efee;        /* 我方气泡底色：主题色 12% 混白 */
      --theme-softer: #eef6f5;      /* 输入框聚焦光圈：主题色 7% 混白 */
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, -apple-system, Segoe UI, sans-serif; color: #1f2937; background: #fff; -webkit-font-smoothing: antialiased; }
    .wrap { height: 100vh; display: grid; grid-template-rows: 52px 1fr auto; }
    .top { display:flex; align-items:center; padding:0 12px; color:#fff; background:var(--theme); font-weight:600; font-size:14px; letter-spacing:.01em; }
    .status { margin-left:auto; font-size:11px; opacity:.75; font-weight:400; }
    .close-btn { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border:0; background:transparent; color:rgba(255,255,255,0.85); border-radius:8px; font-size:15px; cursor:pointer; margin-right:6px; flex-shrink:0; transition:background .15s; }
    .close-btn:hover { background:rgba(255,255,255,0.18); }
    .msgs { padding: 14px 14px 10px; overflow:auto; background:#fff; overscroll-behavior:contain; }
    .msgs::-webkit-scrollbar { width: 5px; }
    .msgs::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
    .msgs::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }
    .msg { max-width: 84%; width: fit-content; margin: 10px 0; padding: 9px 13px; border-radius: 16px; line-height: 1.55; font-size: 14px; overflow-wrap: anywhere; animation: msg-in .18s ease-out; }
    @keyframes msg-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .mine { margin-left: auto; background: var(--theme-soft); color: #1f2937; border-bottom-right-radius: 5px; }
    .peer { background: #f3f4f6; color: #1f2937; border-bottom-left-radius: 5px; }
    .msg p { margin: 0 0 8px; }
    .msg p:last-child { margin-bottom: 0; }
    .msg pre { margin: 8px 0; padding: 8px 10px; border-radius: 10px; overflow: auto; background: rgba(17,24,39,0.06); }
    .msg code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .msg a { color: var(--theme); text-decoration: underline; text-underline-offset: 2px; }
    .msg ul, .msg ol { margin: 6px 0 6px 18px; padding: 0; }
    .msg blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid rgba(17,24,39,0.18); color: #4b5563; }
    .msg img { max-width: 100%; border-radius: 10px; }
    .composer { background:#fff; border-top:1px solid #f0f0f2; padding:10px 12px; display:flex; gap:8px; }
    .input { flex:1; border:1px solid #e4e4e7; border-radius:12px; padding:10px 12px; font-size:14px; color:#1f2937; outline:none; transition:border-color .15s, box-shadow .15s; }
    .input::placeholder { color:#9ca3af; }
    .input:focus { border-color: var(--theme); box-shadow: 0 0 0 3px var(--theme-softer); }
    .send { border:0; border-radius:12px; background: var(--theme); color:#fff; font-weight:600; font-size:14px; padding:0 16px; cursor:pointer; transition:opacity .15s; }
    .send:hover { opacity:.9; }

    /* 通话弹窗 */
    .call-popup { display:none; position:absolute; inset:0; z-index:100; background:#000; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
    .call-popup.active { display:flex; }
    .call-popup-status { color:#fff; font-size:16px; font-weight:600; }
    .call-popup-timer { color:rgba(255,255,255,0.8); font-size:13px; font-variant-numeric:tabular-nums; }
    .call-popup-actions { display:flex; gap:20px; align-items:center; }
    .call-popup-btn { width:52px; height:52px; border:0; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:22px; }
    .call-popup-btn svg { width:26px; height:26px; flex-shrink:0; display:block; }
    .call-popup-btn.hangup { background:#ef4444; color:#fff; }
    .call-popup-btn.speaker { background:rgba(255,255,255,0.2); color:#fff; }
    .call-popup-btn.speaker.on { background:#fff; color:#111; }
    .call-collapse-btn { position:absolute; top:10px; right:10px; width:28px; height:28px; border:0; background:rgba(255,255,255,0.15); color:#fff; border-radius:6px; font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .call-collapse-btn:hover { background:rgba(255,255,255,0.28); }
    /* 折叠横条 */
    .call-bar { display:none; position:absolute; bottom:0; left:0; right:0; z-index:100; height:52px; background:#1c1c1e; flex-direction:row; align-items:center; padding:0 14px; gap:10px; }
    .call-bar.active { display:flex; }
    .call-bar-info { flex:1; overflow:hidden; }
    .call-bar-label { color:#fff; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .call-bar-time { color:rgba(255,255,255,0.6); font-size:12px; font-variant-numeric:tabular-nums; }
    .call-bar-btn { width:36px; height:36px; border:0; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .call-bar-expand { background:rgba(255,255,255,0.15); color:#fff; font-size:18px; }
    .call-bar-expand:hover { background:rgba(255,255,255,0.28); }
    .call-bar-hangup { background:#ef4444; color:#fff; }
    .call-bar-hangup svg { width:18px; height:18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <button class="close-btn" id="closeBtn" type="button" title="Close">✕</button>
      <span id="topTitleDefault">Online Service</span>
      <button id="callBtn" type="button" title="Voice call"
        style="margin-left:auto;border:0;background:rgba(255,255,255,0.18);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;display:none;">📞</button>
      <span class="status" id="status" style="margin-left:8px;">connecting...</span>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <input id="input" class="input" maxlength="2000" placeholder="Type your message..." />
      <button id="send" class="send">Send</button>
    </div>
  </div>
  <!-- 通话弹窗 -->
  <div class="call-popup" id="callPopup">
    <button class="call-collapse-btn" id="collapseCallBtn" type="button" title="Minimize">⌄</button>
    <div class="call-popup-status" id="callPopupStatus">Connecting...</div>
    <div class="call-popup-timer" id="callPopupTimer"></div>
    <div class="call-popup-actions">
      <button class="call-popup-btn speaker" id="speakerBtn" type="button" title="外放/听筒"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
      <button class="call-popup-btn hangup" id="hangupBtn" type="button" title="挂断"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 8.91 18.9a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2z"/></svg></button>
    </div>
  </div>
  <!-- 通话折叠横条 -->
  <div class="call-bar" id="callBar">
    <div class="call-bar-info">
      <div class="call-bar-label" id="callBarLabel"></div>
      <div class="call-bar-time" id="callBarTime"></div>
    </div>
    <button class="call-bar-btn call-bar-expand" id="callBarExpandBtn" type="button" title="Expand">⌃</button>
    <button class="call-bar-btn call-bar-hangup" id="callBarHangupBtn" type="button" title="Hang up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 8.91 18.9a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2z"/></svg></button>
  </div>

      // 归一化 hex 色值为 6 位（不含 #）；非法输入返回 null
      function normalizeHexColor(color) {
        var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(color || '').trim());
        if (!m) return null;
        var h = m[1];
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        return h;
      }
      // 主题色混白，派生浅色（ratio 为主题色占比，如 0.12）；入参为 6 位 hex（不含 #）
      function mixHexWithWhite(h, ratio) {
        function mix(c) { return Math.round(c * ratio + 255 * (1 - ratio)); }
        return 'rgb(' + mix(parseInt(h.slice(0, 2), 16)) + ',' + mix(parseInt(h.slice(2, 4), 16)) + ',' + mix(parseInt(h.slice(4, 6), 16)) + ')';

      // 校验通过才写入主题变量：hex 色用 JS 派生浅色；其他合法 CSS 色（如命名色）用 color-mix 派生；

      function applyThemeColor(color) {

        // 排除"合法但语义为空"的色值：写入后 var(--theme) 同样会失色
        var keyword = String(color).trim().toLowerCase();
        if (keyword === 'transparent' || keyword === 'currentcolor' || keyword === 'inherit' ||

        lastIceServers = null;
        if (lkRoom) {
          // 先关闭麦克风 track，释放 MediaStream 占用的音频会话
          try { lkRoom.localParticipant.setMicrophoneEnabled(false); } catch (_) {}
          try {
            lkRoom.localParticipant.audioTrackPublications.forEach(function (pub) {
              if (pub.track && pub.track.mediaStreamTrack) {
                pub.track.mediaStreamTrack.stop();
              }
            });
          } catch (_) {}
          try { lkRoom.disconnect(); } catch (_) {}
          lkRoom = null;
        }
        // 移除通话期间 attach 的 audio 元素
        var audios = document.querySelectorAll('audio');
        for (var i = 0; i < audios.length; i++) {
          audios[i].pause();
          audios[i].srcObject = null;
          audios[i].parentNode.removeChild(audios[i]);
        }
        if (callBtn) { callBtn.textContent = '📞'; callBtn.disabled = false; }
        hideCallPopup();
        speakerOn = false;
        speakerBtn.classList.remove('on');
        speakerBtn.innerHTML = speakerIconOff;
        setStatus(t('status_online'));
      }

      async function joinCallRoom(roomUrl, roomToken) {
        if (!window.LivekitClient) {
          console.error('[grix-widget] LiveKit SDK not loaded — CDN may be blocked');
          setStatus(t('status_voice_unavailable'));
          sendCallDiag('room_connect_error', 'LiveKit SDK not loaded');
          endCallUI();
          return;
        }
        if (!roomUrl || !roomToken) {
          console.error('[grix-widget] joinCallRoom missing roomUrl or roomToken', { roomUrl: roomUrl, tokenLen: roomToken ? roomToken.length : 0 });
          setStatus(t('status_voice_unavailable'));
          sendCallDiag('room_connect_error', 'missing room_url or room_token');
          endCallUI();
          return;
        }
        try {
          // 构建 Room 选项：传入服务端下发的 ICE 服务器用于 NAT 穿透
          var roomOpts = {};
          if (lastIceServers && lastIceServers.length > 0) {
            roomOpts.iceServers = lastIceServers;
            console.log('[grix-widget] using ICE servers from server:', JSON.stringify(lastIceServers));
          }
          lkRoom = new LivekitClient.Room(roomOpts);
          lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed, function (track) {
            if (track.kind === 'audio') {
              var el = track.attach();
              el.autoplay = true;
              document.body.appendChild(el);
            }
          });
          lkRoom.on(LivekitClient.RoomEvent.Disconnected, function () { endCallUI(); });
          console.log('[grix-widget] connecting to LiveKit room url=' + roomUrl);
          sendCallDiag('room_connect_start', 'url=' + roomUrl);
          await lkRoom.connect(roomUrl, roomToken);
          console.log('[grix-widget] LiveKit room connected');
          sendCallDiag('room_connect_ok');
          try {
            await lkRoom.localParticipant.setMicrophoneEnabled(true);
          } catch (micErr) {
            console.error('[grix-widget] microphone enable failed:', micErr);
            sendCallDiag('mic_publish_error', String(micErr && micErr.message ? micErr.message : micErr));
            // 麦克风失败不中断通话（仍可听到AI），但提示用户
            setStatus(t('status_in_call_mic_off'));
            if (callBtn) { callBtn.textContent = '✕'; }
            startCallTimer();
            callPopupStatus.textContent = t('popup_connected_mic_off');
            return;
          }
          console.log('[grix-widget] microphone enabled');
          sendCallDiag('mic_publish_ok');
          if (callBtn) { callBtn.textContent = '✕'; }
          setStatus(t('status_in_call'));
          startCallTimer();
        } catch (err) {
          console.error('[grix-widget] LiveKit connect failed:', err);
          sendCallDiag('room_connect_error', String(err && err.message ? err.message : err));
          setStatus(t('status_call_failed'));
          endCallUI();
        }
      }

      function toggleCall() {
        if (!cfg) return;
        if (currentCallId || lkRoom) {
          if (currentCallId) sendPacket('call:hangup', { call_id: currentCallId });
          endCallUI();
          return;
        }
        if (!ws || ws.readyState !== 1) {
          showCallError(t('err_connection_lost'));
          return;
        }
        setStatus(t('status_calling'));
        showCallPopup(t('popup_connecting'));
        sendPacket('call:invite', { call_mode: 1 });
        scheduleInviteTimeout();
      }

      function sendMessage() {
        var text = (input.value || '').trim();
        if (!text || !cfg) return;
        sendPacket('send_msg', {
          session_id: cfg.session_id,
          client_msg_id: 'widget_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
          msg_type: 1,
          content: text
        });
        input.value = '';
      }

      var closeBtn = document.getElementById('closeBtn');
      if (closeBtn) closeBtn.addEventListener('click', function () {
        window.parent.postMessage({ type: 'grix_widget_close', payload: { session_id: cfg ? cfg.session_id : '' } }, '*');
      });

      sendBtn.addEventListener('click', sendMessage);
      if (callBtn) callBtn.addEventListener('click', toggleCall);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      window.addEventListener('message', function (event) {
        if (!event || !event.data) return;
        if (event.data.type === 'grix_widget_bootstrap') {
          cfg = event.data.payload || null;
          if (!cfg) return;
          currentLocale = (cfg.locale && I18N[cfg.locale]) ? cfg.locale : 'en_US';
          document.documentElement.lang = currentLocale.replace('_', '-');
          localizeStaticUI();
          if (cfg.theme_color) {
            applyThemeColor(cfg.theme_color);
          }
          if (cfg.title) {
            if (topTitleDefault) topTitleDefault.style.display = 'none';
            var topEl = document.querySelector('.top');
            if (topEl) {
              for (var i = topEl.childNodes.length - 1; i >= 0; i--) {
                if (topEl.childNodes[i].nodeType === 3) { topEl.removeChild(topEl.childNodes[i]); }
              }
              var titleNode = document.createTextNode(cfg.title);
              var ref = topEl.querySelector('.close-btn');
              topEl.insertBefore(titleNode, ref ? ref.nextSibling : topEl.firstChild);
            }
          }
          connect();
          return;
        }
        if (event.data.type === 'grix_widget_token_refresh') {
          var newToken = event.data.payload && event.data.payload.token;
          if (!newToken || !cfg) return;
          cfg.token = newToken;
          // 关闭旧连接，用新 token 重连
          if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
          reconnectAttempt = 0;
          if (ws) { ws.close(); ws = null; }
          connect();
        }
      });
    })();
  </script>
</body>
</html>
