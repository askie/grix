apiVersion: v1
kind: Secret
metadata:
  name: aibot-livekit-egress-env
type: Opaque
stringData:
  # Keep this Secret outside Git. LiveKit Server and Egress must use the same Redis.
  # Tencent COS exposes an S3-compatible endpoint, so use storage.s3.
  EGRESS_CONFIG_BODY: |
    api_key: replace-with-livekit-api-key
    api_secret: replace-with-livekit-api-secret
    ws_url: ws://aibot-livekit:7880
    insecure: true
    health_port: 7981
    redis:
      address: aibot-redis:6379
      password: replace-with-redis-password
    storage:
      s3:
        access_key: replace-with-cos-secret-id
        secret: replace-with-cos-secret-key
        region: replace-with-cos-region
        endpoint: https://cos-internal.replace-with-region.myqcloud.com
        bucket: replace-with-cos-bucket
