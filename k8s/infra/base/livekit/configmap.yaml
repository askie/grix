apiVersion: v1
kind: ConfigMap
metadata:
  name: aibot-livekit-config
data:
  livekit.yaml: |
    port: 7880
    # LiveKit Server and Egress must use the same Redis instance for RPC.
    redis:
      address: aibot-redis:6379
    rtc:
      tcp_port: 7881
      port_range_start: 50100
      port_range_end: 50119
      use_external_ip: true
    room:
      empty_timeout: 300
    turn:
      enabled: false
    logging:
      level: info
