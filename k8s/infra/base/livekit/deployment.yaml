apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibot-livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aibot-livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aibot-livekit
    spec:
      # hostNetwork：NetworkPolicy 对宿主机网络命名空间不生效，本组件的收敛靠
      # securityContext 与宿主机防火墙承担（见 networkpolicy.yaml 注释）。
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false   # LiveKit 不调用 K8s API，不挂载 SA token
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      nodeSelector:
        # 占位值：生产媒体节点 hostname 由 overlay patch 覆盖，公开仓库不保留真实节点标识
        kubernetes.io/hostname: "replace-me-media-node-hostname"
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.12.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --config
            - /etc/livekit/livekit.yaml
            - --node-ip
            # 占位值（文档保留段）：生产节点公网 IP 由 overlay patch 覆盖，公开仓库不保留真实 IP
            - "203.0.113.10"
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: aibot-infra-env
                  key: LIVEKIT_KEYS
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aibot-infra-env
                  key: REDIS_PASSWORD
          ports:
            - name: http
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
      volumes:
        - name: config
          configMap:
            name: aibot-livekit-config
