apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aibot-nats
spec:
  serviceName: aibot-nats-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aibot-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aibot-nats
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: nats
          image: nats:2.9-alpine
          imagePullPolicy: IfNotPresent
          # 账号鉴权 + subject 授权见 nats.conf（ConfigMap aibot-nats-config）；
          # 密码经 Secret aibot-nats-auth 注入，创建方式见本目录 README.md。
          command:
            - nats-server
            - -c
            - /etc/nats/nats.conf
          envFrom:
            - secretRef:
                name: aibot-nats-auth
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/nats
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: aibot-nats-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
