apiVersion: v1
kind: Secret
metadata:
  name: aibot-backend-env
type: Opaque
stringData:
  AIBOT_JWT_SECRET: "replace-with-long-random-secret"
  AIBOT_POSTGRES_PASSWORD: "replace-with-postgres-password"
  AIBOT_SERVER_ALLOWED_WEB_ORIGINS: "https://app.example.com"
  AIBOT_SERVER_AGENT_API_DOMAIN: "wss://api.example.com"
  # 部署区域标识（cn / global）：生产各区必填，发布门限按 profile 强校验
  # （prod→cn，k3s/aws→global）。区域运行时配置唯一来源是 secret env，
  # 禁止写进 overlay configmap-patch（永远下发不到线上）。
  AIBOT_SERVER_REGION: "global"
  # 返回给客户端的 WS 公网地址（wss://…）：定版值待定，暂不设置；配了会过
  # wss:// 格式校验。⛔ 切勿写空串——env 覆盖用 LookupEnv，present-empty 也会
  # 覆盖 configmap 值。要么不写，要么写真实值。
  # AIBOT_SERVER_PUBLIC_WS_URL: "wss://<本区 WS 域名>/ws"
  # 全球区（PROFILE=k3s）必填：Google 登录允许的 OAuth Client ID（逗号分隔，
  # Web/Server、iOS、Android 三端），发布门限 validate_global_oauth_secret 强校验。
  # 大陆区（PROFILE=prod）不启用 Google 登录，可留空。
  AIBOT_OAUTH_GOOGLE_ALLOWED_CLIENT_IDS: ""
  AIBOT_REDIS_PASSWORD: "replace-with-redis-password"
  AIBOT_OSS_MEDIA_ENDPOINT: ""
  AIBOT_OSS_MEDIA_ACCESS_KEY: ""
  AIBOT_OSS_MEDIA_SECRET_KEY: ""
  AIBOT_OSS_MEDIA_BUCKET: ""
  AIBOT_OSS_MEDIA_REGION: ""
  AIBOT_OSS_MEDIA_PUBLIC_URL: ""
  AIBOT_OSS_MEDIA_STORAGE_DIR: "aibot/media"
  AIBOT_OSS_AVATAR_ENDPOINT: ""
  AIBOT_OSS_AVATAR_ACCESS_KEY: ""
  AIBOT_OSS_AVATAR_SECRET_KEY: ""
  AIBOT_OSS_AVATAR_BUCKET: ""
  AIBOT_OSS_AVATAR_REGION: ""
  AIBOT_OSS_AVATAR_PUBLIC_URL: ""
  AIBOT_OSS_AVATAR_STORAGE_DIR: "aibot/avatar"
  AIBOT_OSS_REPORT_ENDPOINT: ""
  AIBOT_OSS_REPORT_ACCESS_KEY: ""
  AIBOT_OSS_REPORT_SECRET_KEY: ""
  AIBOT_OSS_REPORT_BUCKET: ""
  AIBOT_OSS_REPORT_REGION: ""
  AIBOT_OSS_REPORT_PUBLIC_URL: ""
  AIBOT_OSS_REPORT_STORAGE_DIR: "aibot/report"
  AIBOT_MIGRATION_LEGACY_OSS_ENDPOINT: ""
  AIBOT_MIGRATION_LEGACY_OSS_ACCESS_KEY: ""
  AIBOT_MIGRATION_LEGACY_OSS_SECRET_KEY: ""
  AIBOT_MIGRATION_LEGACY_OSS_BUCKET: ""
  AIBOT_MIGRATION_LEGACY_OSS_REGION: ""
  AIBOT_MIGRATION_LEGACY_OSS_PUBLIC_URL: ""
  AIBOT_MIGRATION_LEGACY_OSS_STORAGE_DIR: "aibot"
  AIBOT_OPENAI_API_KEY: ""
  AIBOT_OPENAI_BASE_URL: ""
  AIBOT_OPENAI_DEFAULT_MODEL: ""
  AIBOT_CLAUDE_API_KEY: ""
  AIBOT_CLAUDE_BASE_URL: ""
  AIBOT_CLAUDE_DEFAULT_MODEL: ""
  # 注：大模型计费网关(cmd/gateway)的上游厂商官方Key不再放这里，改由塘主后台动态管理、密文落库。
  AIBOT_LLM_TRANSLATION_API_KEY: ""
  AIBOT_LLM_TRANSLATION_BASE_URL: ""
  AIBOT_LLM_TRANSLATION_PROXY_URL: ""
  AIBOT_LLM_TRANSLATION_API_STYLE: "responses"
  AIBOT_LLM_TRANSLATION_MODEL: ""
  AIBOT_LLM_TRANSLATION_REASONING_EFFORT: ""
  AIBOT_LLM_TRANSLATION_TEMPERATURE: "0.2"
  AIBOT_LLM_TRANSLATION_MAX_OUTPUT_TOKENS: "800"
  AIBOT_LLM_TRANSLATION_REQUEST_TIMEOUT_SEC: "60"
  AIBOT_LLM_TRANSLATION_EXTRA_BODY_JSON: ""
  AIBOT_LLM_TRANSLATION_EXTRA_HEADERS_JSON: ""
  AIBOT_PUSH_APNS_KEY_PATH: ""
  AIBOT_PUSH_APNS_KEY_ID: ""
  AIBOT_PUSH_APNS_TEAM_ID: ""
  AIBOT_PUSH_APNS_TOPIC: ""
  AIBOT_PUSH_APNS_IS_PRODUCTION: "false"
  AIBOT_PUSH_FCM_CREDENTIALS_FILE: ""
  AIBOT_PUSH_JPUSH_APP_KEY: ""
  AIBOT_PUSH_JPUSH_MASTER_SECRET: ""
  AIBOT_PUSH_WEBPUSH_VAPID_PUBLIC_KEY: ""
  AIBOT_PUSH_WEBPUSH_VAPID_PRIVATE_KEY: ""
  AIBOT_PUSH_WEBPUSH_SUBSCRIBER: ""
  AIBOT_PUSH_HUAWEI_APP_ID: ""
  AIBOT_PUSH_HUAWEI_CLIENT_ID: ""
  AIBOT_PUSH_HUAWEI_CLIENT_SECRET: ""
  AIBOT_PUSH_XIAOMI_APP_SECRET: ""
  AIBOT_PUSH_XIAOMI_PACKAGE_NAME: ""
  AIBOT_ALI_EMAIL_ACCESS_KEY_ID: ""
  AIBOT_ALI_EMAIL_ACCESS_KEY_SECRET: ""
  AIBOT_ALI_EMAIL_REGION_ID: "cn-hangzhou"
  AIBOT_ALI_EMAIL_ENDPOINT: "dm.aliyuncs.com"
  AIBOT_ALI_EMAIL_FROM_ADDRESS: "no-reply@example.com"
  # Phase 2: LiveKit（语音通话媒体服务器）
  AIBOT_LIVEKIT_URL: "wss://livekit.example.com"
  AIBOT_LIVEKIT_API_KEY: "replace-with-livekit-api-key"
  AIBOT_LIVEKIT_API_SECRET: "replace-with-livekit-api-secret"
  # TURN relay（下发给客户端的 ICE 配置；不设则用 config.yaml 默认值——指向中国区域名）
  AIBOT_LIVEKIT_TURN_URLS: "turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp"
  AIBOT_LIVEKIT_TURN_USERNAME: "replace-with-turn-user"
  AIBOT_LIVEKIT_TURN_CREDENTIAL: "replace-with-turn-password"
  AIBOT_POSTGRES_SSLMODE: "require"
  AIBOT_SERVER_WEBHOOK_TOKEN_SECRET: "replace-with-dedicated-webhook-secret"
  AIBOT_SERVER_VOICE_CRYPTO_SECRET: "replace-with-dedicated-voice-crypto-secret"
  # 支付系统(cmd/pay)加密密钥：专用，不与上面任何密钥复用。塘主后台录入的支付宝/PayPal 商户密钥落库前用它加密。
  AIBOT_SERVER_PAY_CRYPTO_SECRET: "replace-with-dedicated-pay-crypto-secret"
  # pay 的回调对外基址：生产各区必填，唯一来源就是 secret env（overlay
  # configmap-patch 永远下发不到线上，2026-07-10 事故根因；发布门限
  # validate_region_runtime_secret 会强制校验 https:// 真实值）。
  # CN 用 https://grix.dhf.pub，全球区用 https://gb.grix.im。
  AIBOT_PAY_NOTIFY_URL_BASE: "https://app.example.com"
