apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aibot-postgres
spec:
  serviceName: aibot-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aibot-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aibot-postgres
    spec:
      automountServiceAccountToken: false   # PostgreSQL 不调用 K8s API，不挂载 SA token
      # 官方 postgres 入口必须 root 启动（chown 数据目录后 gosu 降权到 postgres），
      # 故不设 runAsNonRoot；降权所需最小 capabilities 在容器级补回，其余全部 drop。
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: pgvector/pgvector:pg15
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # 官方入口 root 阶段需要：chown 数据目录、gosu 降权到 postgres
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          envFrom:
            - secretRef:
                name: aibot-infra-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d/01-enable-pgvector.sql
              subPath: 01-enable-pgvector.sql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d/02-replication-hba.sh
              subPath: 02-replication-hba.sh
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: initdb
          configMap:
            name: aibot-postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
