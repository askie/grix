apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibot-pay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aibot-pay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aibot-pay
    spec:
      automountServiceAccountToken: false   # 业务服务不调用 K8s API，不挂载 SA token
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: pay
          image: ghcr.io/your-org/aibot-backend-pay:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: AIBOT_SKIP_SCHEMA_INIT   # 经 PgBouncer 池化的业务服务跳过会话锁式 schema 初始化；迁移由 migrate Job 负责
              value: "1"
            - name: AIBOT_SERVICE
              value: pay
            - name: AIBOT_CONFIG_PATH
              value: /app/config/config.yaml
          envFrom:
            - secretRef:
                name: aibot-backend-env
          ports:
            - name: http
              containerPort: 27185
          # readiness 打 /readyz：它真的探 DB/Redis(/NATS)，探不通就把这个 Pod 摘出
          # Service 端点，滚动发布也会因此卡住而不是把坏实例放进流量。
          # liveness 仍打 /health（静态 ok）：依赖抖动时该等它自愈，不该反复重启进程。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: backend-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: backend-config
          configMap:
            name: aibot-backend-config
