apiVersion: v1
kind: Secret
metadata:
  name: aibot-voicebridge-env
type: Opaque
stringData:
  # LiveKit Server
  LIVEKIT_URL: "wss://livekit.example.com"
  LIVEKIT_API_KEY: "replace-with-livekit-api-key"
  LIVEKIT_API_SECRET: "replace-with-livekit-api-secret"
  # 语音大模型凭证为 BYOK，由用户在 agent 上自配，经 NATS start 消息下发，voicebridge 不再用环境变量。
  # NATS 鉴权（voicebridge 账号，密码须与 Secret aibot-nats-auth 中 NATS_VOICEBRIDGE_PASSWORD 一致，见 k8s/infra/base/nats/README.md）
  NATS_USER: "voicebridge"
  NATS_PASSWORD: "replace-with-nats-voicebridge-password"
