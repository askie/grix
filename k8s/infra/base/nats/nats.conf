# nats-server 配置：启用账号鉴权 + subject 级授权。
# 密码不落清单：$NATS_BACKEND_PASSWORD / $NATS_VOICEBRIDGE_PASSWORD 由
# aibot-nats-auth Secret 注入为容器环境变量，nats-server 启动时展开。
# 注意：密码不得包含 `$`（会被当作变量引用），生成方式见 README.md。

jetstream: enabled
store_dir: /data/jetstream
http: 8222

authorization {
  users: [
    {
      # 后端（aibot-server）：控制面 + JetStream 业务面客户端。
      # 业务 subject 按代码实际 pub/sub 最小集合授权（stream AIBOT 登记集合），
      # 不全开；$JS.API.> 是 JetStream 管理面（InitNATS stream reconcile +
      # 各 durable 消费者创建/拉取）所必需。
      user: "aibot-backend"
      password: "$NATS_BACKEND_PASSWORD"
      permissions: {
        publish: [
          "voicebridge.>",
          "ai.request.*",
          "ai.embedding.generate",
          "im.push.offline.*",
          "im.reach.event",
          "agent.notification.events",
          "agent.notification.tts",
          "pay.order.*",
          "pay.refund.*",
          "pay.reconcile.*",
          "$JS.API.>",
          "_INBOX.>"
        ]
        subscribe: [
          "voicebridge.>",
          "ai.request.*",
          "ai.embedding.generate",
          "im.push.offline.*",
          "im.reach.event",
          "agent.notification.events",
          "pay.order.paid",
          "_INBOX.>"
        ]
      }
    },
    {
      # voicebridge worker：最小权限。
      # 只订阅控制/注入主题；只能发布自己产出的主题——
      # 即使 worker 被攻破，也无法伪造 control.start/inject 下行指令。
      user: "voicebridge"
      password: "$NATS_VOICEBRIDGE_PASSWORD"
      permissions: {
        publish: [
          "voicebridge.transcript.>",
          "voicebridge.control.error.>",
          "voicebridge.control.bridge_exit",
          "voicebridge.control.stop",
          # 健康探针（healthcheck.py 与 worker 同账号）向节点定向 subject 发 request
          "voicebridge.control.health.>",
          "_INBOX.>"
        ]
        subscribe: [
          "voicebridge.control.>",
          "voicebridge.inject.>",
          "_INBOX.>"
        ]
      }
    }
  ]
}
