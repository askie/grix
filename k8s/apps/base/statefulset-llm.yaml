apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aibot-llm
spec:
  serviceName: aibot-llm-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aibot-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aibot-llm
    spec:
      automountServiceAccountToken: false   # 业务服务不调用 K8s API，不挂载 SA token
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: llm
          image: ghcr.io/your-org/aibot-backend-llm:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: AIBOT_SKIP_SCHEMA_INIT   # 经 PgBouncer 池化的业务服务跳过会话锁式 schema 初始化；迁移由 migrate Job 负责
              value: "1"
            - name: AIBOT_SERVICE
              value: llm
            - name: AIBOT_CONFIG_PATH
              value: /app/config/config.yaml
            - name: AIBOT_MACHINE_ID_BASE
              value: "256"
          envFrom:
            - secretRef:
                name: aibot-backend-env
          ports:
            - name: http
              containerPort: 27182
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: backend-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: backend-config
          configMap:
            name: aibot-backend-config
